<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股每日策略看板</title>
<style>
  :root { --bg:#0f1419; --card:#1a2029; --bd:#2a3441; --txt:#e6edf3; --mut:#8b98a8;
          --up:#f85149; --down:#3fb950; --accent:#58a6ff; --gold:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,"Microsoft YaHei",sans-serif; padding:20px; }
  .wrap { max-width:1080px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
  h1 { font-size:22px; }
  .sub { color:var(--mut); font-size:13px; margin-top:4px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; border:1px solid var(--bd); color:var(--txt); }
  button.mini { padding:3px 8px; font-size:12px; background:#3a2f12; }
  button:disabled { opacity:.5; cursor:wait; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:820px){ .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin-bottom:12px; color:var(--accent); }
  .market { white-space:pre-wrap; font-size:14px; line-height:1.7; }
  .sector-head { font-weight:700; color:var(--gold); padding:10px 0 4px; border-bottom:1px solid var(--bd); font-size:14px; }
  .pick { padding:10px 0; border-bottom:1px solid var(--bd); }
  .pick:last-child { border-bottom:none; }
  .pick .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .pick .nm { font-weight:600; }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; background:#123; color:var(--accent); }
  .tag.buy { background:#3a1d1d; color:var(--up); }
  .tag.sell { background:#122b1a; color:var(--down); }
  .tag.gold { background:#3a2f12; color:var(--gold); }
  .pick .reason { color:var(--mut); font-size:12px; margin-top:4px; }
  .metric { font-size:13px; color:var(--mut); margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .warn { color:var(--up); font-weight:700; }
  .take { color:var(--down); font-weight:700; }
  .warn-row { background:#3a1d1d; }
  .trigger-banner { margin-top:10px; padding:10px 12px; border:1px solid var(--up); border-radius:8px;
    color:var(--up); font-size:14px; font-weight:600; }
  .data-warn { margin-bottom:12px; padding:10px 12px; border:1px solid var(--gold); border-radius:8px;
    color:var(--gold); font-size:13px; line-height:1.7; background:#2a2312; }
  .status-item { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:13px; flex-wrap:wrap; }
  .status-ok { color:var(--down); font-weight:600; }
  .status-bad { color:var(--gold); font-weight:600; }
  .progress-bar { width:100%; height:14px; background:#0d1117; border:1px solid var(--bd); border-radius:8px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:var(--accent); transition:width .3s ease; }
  .progress-text { color:var(--mut); font-size:13px; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:8px 6px; border-bottom:1px solid var(--bd); }
  th:first-child,td:first-child { text-align:left; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  input { background:#0d1117; border:1px solid var(--bd); color:var(--txt); border-radius:6px; padding:7px 10px; font-size:13px; width:120px; }
  input.small { width:90px; }
  .total { font-size:15px; margin-top:10px; }
  .loading { color:var(--mut); font-style:italic; padding:20px; }
  .watch-item { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--bd); }
  .watch-item .nm { font-weight:600; }
  .watch-item .sec { color:var(--mut); font-size:12px; }
  .hint { color:var(--mut); font-size:12px; margin-bottom:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>📈 A股每日策略看板</h1>
      <div class="sub" id="gen-time">加载中…</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="ghost" onclick="refreshPnl()">🔄 刷新持仓盈亏</button>
      <button id="btn-refresh" onclick="refreshReport()">🔍 刷新今日分析</button>
    </div>
  </header>

  <div id="progress-wrap" style="display:none;">
    <div class="card">
      <h2>⏳ 刷新进度</h2>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">准备中…</div>
    </div>
  </div>

  <div class="card">
    <h2>📡 数据状态</h2>
    <div id="status"><div class="loading">加载中…</div></div>
  </div>

  <div class="card">
    <h2>市场情绪</h2>
    <div class="market" id="market">加载中…</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>🎯 今日推荐 Top 10 总榜</h2>
      <div id="picks"><div class="loading">加载中…</div></div>
    </div>
    <div class="card">
      <h2>⭐ 自选股买卖信号</h2>
      <div id="recs"><div class="loading">加载中…</div></div>
    </div>
  </div>

  <div class="card">
    <h2>✏️ 自选股管理（增删要测试的股票）</h2>
    <div class="hint">输入代码 + 名称 + 板块（可留空），保存后「刷新今日分析」即可生效</div>
    <div class="row">
      <input id="w-symbol" class="small" placeholder="代码 600519" onblur="autoFillWatch()">
      <button class="ghost" onclick="autoFillWatch()">🔍 获取名称</button>
      <input id="w-name" placeholder="名称（自动填充）">
      <input id="w-sector" class="small" placeholder="板块（自动填充）">
      <button onclick="addWatch()">➕ 添加</button>
    </div>
    <div id="watch"><div class="loading">加载中…</div></div>
  </div>

  <div class="card">
    <h2>💼 我的持仓（实时盈亏）</h2>
    <div class="row">
      <input id="h-symbol" class="small" placeholder="代码 600519" onblur="autoFillHolding()">
      <button class="ghost" onclick="autoFillHolding()">🔍 获取名称</button>
      <input id="h-name" placeholder="名称（自动填充）">
      <input id="h-shares" class="small" placeholder="股数" type="number" step="100">
      <input id="h-cost" class="small" placeholder="成本价" type="number" step="0.01">
      <button onclick="addHolding()">➕ 添加持仓</button>
    </div>
    <div class="row">
      <input id="s-symbol" class="small" placeholder="代码 600519" onblur="autoFillSell()">
      <input id="s-shares" class="small" placeholder="卖出股数" type="number" step="100">
      <button class="ghost" onclick="sellHolding()">🔻 卖出/减持</button>
    </div>
    <div id="pnl"><div class="loading">尚未加载持仓…</div></div>
  </div>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function getJSON(url, opts){ const r = await fetch(url, opts); return r.json(); }

async function autoFillWatch(){
  const sym = document.getElementById('w-symbol').value.trim();
  if(!sym) return;
  try {
    const d = await getJSON('/api/stock_info?symbol='+encodeURIComponent(sym));
    if(d.ok){ document.getElementById('w-name').value=d.name; document.getElementById('w-sector').value=d.sector||''; }
    else alert('未找到该代码：'+sym);
  } catch(e){ alert('获取名称失败：'+e); }
}
async function autoFillHolding(){
  const sym = document.getElementById('h-symbol').value.trim();
  if(!sym) return;
  try {
    const d = await getJSON('/api/stock_info?symbol='+encodeURIComponent(sym));
    if(d.ok){ document.getElementById('h-name').value=d.name; }
    else alert('未找到该代码：'+sym);
  } catch(e){ alert('获取名称失败：'+e); }
}

function renderPick(p, i){
  if(p.error) return '<div class="metric">'+esc(p.error)+'</div>';
  const sc = p.final_score!=null ? p.final_score : p.tech_score;
  const num = (i==null) ? '' : (i+1)+'. ';
  const tag = '<span class="tag gold">评分 '+esc(sc)+'</span>';
  return '<div class="pick"><div class="top"><span class="nm">'+esc(num)+esc(p.name)+' <span class="metric">('+esc(p.symbol)+')</span></span>'+tag+'</div>'
    + '<div class="metric">收盘 '+esc(p.close)+' · 5日 '+esc(p.ret5_pct)+'% · 20日 '+esc(p.ret20_pct)+'% · 成交 '+esc(p.amount_yi)+'亿</div>'
    + (p.reason ? '<div class="reason">💡 '+esc(p.reason)+'</div>' : '')
    + '</div>';
}

function renderStatus(r){
  const el = document.getElementById('status');
  const s = r.status;
  if(!s){ el.innerHTML='<div class="loading">（旧报告，点「刷新今日分析」后显示状态）</div>'; return; }
  const badge = (good) => good ? '<span class="status-ok">✅ 成功</span>' : '<span class="status-bad">⚠️ 失败</span>';
  const rows = [
    ['大模型连接', s.llm_ok, s.llm_ok ? '大模型('+esc(s.model||'')+')' : '词典法回退'],
    ['新闻抓取', s.news_fetch_ok, ''],
    ['新闻语义打分', s.news_scoring_ok, s.news_scoring_ok ? '' : '本榜为纯技术面'],
    ['行情数据', s.data_ok, s.data_ok ? '' : '部分自选股取数失败'],
    ['交易日历', s.calendar_ok, s.calendar_ok ? '' : '下一交易日按工作日估算'],
  ];
  if(s.screen_ok != null) rows.push(['全市场扫描', s.screen_ok, s.screen_ok ? '' : '有效样本不足，推荐榜不可用']);
  el.innerHTML = rows.map(function(it){
    return '<div class="status-item"><span>'+esc(it[0])+'</span> '+badge(it[1])+(it[2]?' <span class="metric">'+esc(it[2])+'</span>':'')+'</div>';
  }).join('');
}

function renderReport(r){
  renderStatus(r);
  document.getElementById('gen-time').textContent = '生成于 ' + (r.generated_at||'')
    + ' · 数据日 ' + (r.market_data_date||'—')
    + ' · 下一交易日 ' + (r.target_trade_date||'—')
    + (r.llm_enabled ? ' · ✅ 大模型(' + esc(r.model) + ')' : ' · ⚠️ 词典法');
  document.getElementById('market').textContent = r.market_view || '（无）';

  // 数据质量警告（新闻打分失败 / 交易日历缺失 / 数据过期）
  const warns = [];
  if(r.data_quality && r.data_quality.screen_error)
    warns.push('⚠️ 全市场选股失败：' + esc(r.data_quality.screen_error) + '；未生成可执行推荐');
  if(r.news_scoring && r.news_scoring.ok === false)
    warns.push('⚠️ 候选股新闻打分失败，本榜已降级为技术面排序');
  const dq = r.data_quality || {};
  if(dq.calendar_ok === false) warns.push('⚠️ 交易日历获取失败，下一交易日按工作日估算');
  const screen = dq.screen || {};
  if(screen.scanned && screen.success_rate < 0.8){
    warns.push('⚠️ 全市场扫描仅成功 ' + screen.success + '/' + screen.scanned
      + '（' + Math.round(screen.success_rate*100) + '%），推荐样本不完整');
  }
  if(screen.market_regime === 'risk') warns.push('⚠️ 市场处于风险下降状态，推荐数量已限制，优先控制仓位');
  else if(screen.market_regime === 'neutral') warns.push('ℹ️ 市场处于震荡状态，推荐数量和入选门槛已收紧');
  if(r.data_fresh === false) warns.push('⚠️ 数据已过期（' + (r.stale_stock_count||0) + ' 只自选股数据超过3天），请点「刷新今日分析」');
  const warnHtml = warns.length ? '<div class="data-warn">'+warns.join('<br>')+'</div>' : '';

  const picks = document.getElementById('picks');
  const plist = r.picks || [];
  const grouped = r.picks_by_sector || {};
  if(plist.length===0){ picks.innerHTML=warnHtml+'<div class="loading">暂无</div>'; }
  else {
    // 总榜（按评分排序）
    let html = '<div class="sector-head">📊 总榜（Top '+plist.length+'，按综合评分）</div>';
    html += plist.map((p,i)=>renderPick(p,i)).join('');
    // 按板块分组
    if(Object.keys(grouped).length>0){
      html += '<div class="sector-head" style="margin-top:12px;">🗂 按板块</div>';
      for(const [sec, arr] of Object.entries(grouped)){
        html += '<div class="sector-head">'+esc(sec)+' <span class="metric">('+arr.length+')</span></div>';
        html += arr.map((p)=>renderPick(p, null)).join('');
      }
    }
    picks.innerHTML = warnHtml + html;
  }
}

function renderRecs(rlist){
  const recs = document.getElementById('recs');
  if(!rlist || rlist.length===0){ recs.innerHTML='<div class="loading">暂无自选股信号</div>'; return; }
  recs.innerHTML = rlist.map(x=>{
    if(x.error) return '<div class="pick"><span class="metric">'+esc(x.name)+': '+esc(x.error)+'</span></div>';
    let cls = 'tag'; let act = x.action||'持有';
    if(act.includes('买入')) cls='tag buy';
    else if(act.includes('卖出')) cls='tag sell';
    const d = x.detail||{};
    return '<div class="pick"><div class="top"><span class="nm">'+esc(x.name)+' ('+esc(x.symbol)+')</span>'
      + '<span><span class="badge '+ (cls==='tag sell'?'down':'up') +'">'+esc(act)+'</span><span class="conf"> 置信'+esc(x.confidence)+'%</span></span></div>'
      + '<div class="metric">收盘 '+esc(d.close)+' · MA5='+esc(d.ma_short)+' MA20='+esc(d.ma_long)+'</div>'
      + (x.reasons||[]).map(r=>'<div class="metric">- '+esc(r)+'</div>').join('')
      + '</div>';
  }).join('');
}

async function loadRecs(){
  try {
    const d = await getJSON('/api/recs');
    renderRecs(d.recs);
    if(d.market_view) document.getElementById('market').textContent = d.market_view;
  } catch(e){ /* 静默，避免重复弹窗 */ }
}

async function loadReport(refresh){
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true; btn.textContent = '分析中…';
  let pollTimer = null;
  if(refresh){
    showProgress();
    pollTimer = setInterval(pollProgress, 800);
  }
  try { renderReport(await getJSON('/api/report' + (refresh?'?refresh=1':''))); }
  catch(e){ alert('加载报告失败：'+e); }
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  hideProgress();
  btn.disabled = false; btn.textContent = '🔍 刷新今日分析';
}
function refreshReport(){ loadReport(true); }

function showProgress(){
  document.getElementById('progress-wrap').style.display = '';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-text').textContent = '准备中…';
}
function hideProgress(){
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').textContent = '完成 ✅';
  setTimeout(function(){ document.getElementById('progress-wrap').style.display = 'none'; }, 900);
}
async function pollProgress(){
  try {
    const p = await getJSON('/api/progress');
    document.getElementById('progress-fill').style.width = (p.percent||0) + '%';
    document.getElementById('progress-text').textContent = (p.stage||'') + (p.detail ? ' · '+p.detail : '');
  } catch(e){ /* 忽略轮询错误 */ }
}

function renderWatch(items){
  const el = document.getElementById('watch');
  if(!items || items.length===0){ el.innerHTML='<div class="loading">暂无自选股</div>'; return; }
  el.innerHTML = items.map(it=>'<div class="watch-item"><span><span class="nm">'+esc(it.name)+'</span> <span class="metric">('+esc(it.symbol)+')</span> <span class="sec">'+esc(it.sector||'')+'</span></span><button class="mini" onclick="removeWatch(\''+esc(it.symbol)+'\')">删除</button></div>').join('');
}
async function loadWatch(){ renderWatch(await getJSON('/api/watchlist')); }
async function addWatch(){
  const symbol = document.getElementById('w-symbol').value.trim();
  const name = document.getElementById('w-name').value.trim();
  const sector = document.getElementById('w-sector').value.trim();
  if(!symbol || !name){ alert('请填写代码和名称（或点「获取名称」自动填充）'); return; }
  try {
    const r = await fetch('/api/watchlist/item', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol, name, sector})});
    const d = await r.json();
    if(!r.ok || !d.ok){ alert(d.error || '保存失败：HTTP '+r.status); return; }
    document.getElementById('w-symbol').value=''; document.getElementById('w-name').value=''; document.getElementById('w-sector').value='';
    renderWatch(d.items);
    alert('✅ 已添加 ' + name + '，正在更新信号…');
    loadRecs();  // 快速重算自选股信号
  } catch(e){ alert('添加失败：'+e); }
}
async function removeWatch(symbol){
  try {
    const r = await fetch('/api/watchlist/item', {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol})});
    const d = await r.json();
    if(!r.ok || !d.ok){ alert(d.error || '删除失败'); return; }
    renderWatch(d.items);
    loadRecs();  // 快速重算自选股信号
  } catch(e){ alert('删除失败：'+e); }
}

function renderPnl(d){
  const el = document.getElementById('pnl');
  if(!d.rows || d.rows.length===0){ el.innerHTML='<div class="loading">暂无持仓，请在上面添加。</div>'; return; }
  let html = '<table><tr><th>代码</th><th>名称</th><th>股数</th><th>成本</th><th>现价</th><th>盈亏%</th><th>止损价</th><th>止盈价</th><th>状态</th></tr>';
  let warnCount = 0;
  for(const r of d.rows){
    let pnlCls = r.pnl==null?'':(r.pnl>=0?'up':'down');
    let status = '持有';
    let statusCls = '';
    if(r.trigger==='止损'){ status='⚠️ 触发止损'; statusCls='warn'; warnCount++; }
    else if(r.trigger==='止盈'){ status='✅ 触发止盈'; statusCls='take'; warnCount++; }
    html += '<tr class="'+(statusCls?'warn-row':'')+'"><td>'+esc(r.symbol)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.shares)+'</td><td>'+esc(r.cost)+'</td>'
      + '<td>'+(r.price==null?'—':esc(r.price))+'</td>'
      + '<td class="'+pnlCls+'">'+(r.pnl_pct==null?'—':(r.pnl_pct>=0?'+':'')+r.pnl_pct+'%')+'</td>'
      + '<td>'+(r.stop_loss?esc(r.stop_loss):'—')+'</td><td>'+(r.take_profit?esc(r.take_profit):'—')+'</td>'
      + '<td class="'+statusCls+'">'+status+'</td></tr>';
  }
  html += '</table>';
  const t = d.total_pnl;
  const valueLabel = d.partial ? '已报价市值' : '总市值';
  const pnlLabel = d.partial ? '已报价持仓盈亏' : '总盈亏';
  const partialNote = d.partial ? ' <span class="warn">（' + d.missing_quotes + ' 只无报价，未报价成本 '+d.unpriced_cost.toLocaleString()+' 元）</span>' : '';
  html += '<div class="total">总成本 '+d.total_cost.toLocaleString()+' 元 · '+valueLabel+' '+d.total_value.toLocaleString()+' 元 · '
    + pnlLabel+' <span class="'+(t>=0?'up':'down')+'">'+(t>=0?'+':'')+t.toLocaleString()+' 元 ('+(t>=0?'+':'')+d.total_pnl_pct+'%)</span>'+partialNote+'</div>';
  if(warnCount>0){
    html += '<div class="trigger-banner">⚠️ 有 '+warnCount+' 只持仓已触发止损/止盈，建议按提示卖出（止损=跌破成本-8%，止盈=达到成本+25%）。</div>';
  }
  el.innerHTML = html;
}
async function loadPnl(){ renderPnl(await getJSON('/api/pnl')); }
async function refreshPnl(){ document.getElementById('pnl').innerHTML='<div class="loading">获取实时行情中…（约15秒）</div>'; await loadPnl(); }
async function addHolding(){
  const symbol = document.getElementById('h-symbol').value.trim();
  const name = document.getElementById('h-name').value.trim();
  const shares = parseInt(document.getElementById('h-shares').value,10);
  const cost = parseFloat(document.getElementById('h-cost').value);
  if(!symbol || !name || !shares || !cost){ alert('请填写代码、名称、股数、成本价（点「获取名称」可自动填名称）'); return; }
  try {
    const r = await fetch('/api/holdings/item', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol, name, shares, cost_price:cost})});
    const d = await r.json();
    if(!r.ok || !d.ok){ alert(d.error || '保存失败：HTTP '+r.status); return; }
    document.getElementById('h-symbol').value=''; document.getElementById('h-name').value='';
    document.getElementById('h-shares').value=''; document.getElementById('h-cost').value='';
    alert('✅ 已添加持仓 ' + name);
    await loadPnl();
  } catch(e){ alert('添加失败：'+e); }
}

async function autoFillSell(){
  const sym = document.getElementById('s-symbol').value.trim();
  if(!sym) return;
  const d = await getJSON('/api/stock_info?symbol='+encodeURIComponent(sym));
  // 找到该持仓，把剩余股数填进去方便全卖
  const items = await getJSON('/api/holdings');
  const h = items.find(x=>x.symbol===sym);
  if(h){ document.getElementById('s-shares').value = h.shares; }
}
async function sellHolding(){
  const symbol = document.getElementById('s-symbol').value.trim();
  const shares = parseInt(document.getElementById('s-shares').value,10);
  if(!symbol || !shares){ alert('请填写代码和卖出股数'); return; }
  try {
    const r = await fetch('/api/holdings/sell', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol, shares})});
    const d = await r.json();
    if(!d.ok){ alert(d.error || '卖出失败'); return; }
    alert('✅ 已卖出 ' + shares + ' 股' + (d.remain>0 ? '，剩余 '+d.remain+' 股' : '（已清仓）'));
    document.getElementById('s-symbol').value=''; document.getElementById('s-shares').value='';
    await loadPnl();
  } catch(e){ alert('卖出失败：'+e); }
}
