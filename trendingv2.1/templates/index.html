<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trendingv2.1 — A股辅助看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #0a0e12;
    --bg1: #10161d;
    --bg2: #161e27;
    --panel: rgba(22, 30, 39, 0.92);
    --bd: #2a3542;
    --bd-soft: #1e2833;
    --txt: #e8eef4;
    --mut: #8b9aab;
    --up: #ff6b5a;
    --down: #3dd68c;
    --accent: #3db8a8;
    --accent-dim: rgba(61, 184, 168, 0.14);
    --gold: #e0b44e;
    --gold-dim: rgba(224, 180, 78, 0.12);
    --warn-bg: rgba(224, 180, 78, 0.1);
    --danger-bg: rgba(255, 107, 90, 0.12);
    --radius: 12px;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    --font: "IBM Plex Sans", "Noto Sans SC", sans-serif;
    --display: "Syne", "Noto Sans SC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--txt);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(61, 184, 168, 0.16), transparent 55%),
      radial-gradient(900px 500px at 100% 0%, rgba(224, 180, 78, 0.08), transparent 50%),
      linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 45%, #0c1218 100%);
    background-attachment: fixed;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }

  /* —— Brand header —— */
  .hero {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--bd-soft);
    animation: fadeUp .45s ease both;
  }
  .brand {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: -0.03em;
    line-height: 1.05;
    background: linear-gradient(120deg, #f2f7fa 20%, var(--accent) 90%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .tagline { color: var(--mut); font-size: 13px; margin-top: 8px; max-width: 36em; }
  .meta-line { color: var(--mut); font-size: 12px; margin-top: 6px; letter-spacing: 0.01em; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  button {
    font-family: var(--font);
    background: var(--accent);
    color: #041210;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: transform .15s ease, filter .15s ease, background .15s ease;
  }
  button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button.ghost {
    background: transparent;
    border: 1px solid var(--bd);
    color: var(--txt);
    font-weight: 500;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.mini {
    padding: 3px 9px; font-size: 12px; font-weight: 500;
    background: var(--gold-dim); color: var(--gold); border: 1px solid transparent;
  }
  button:disabled { opacity: .55; cursor: wait; transform: none; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 14px 12px 40px; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    animation: fadeUp .5s ease both;
  }
  .panel:nth-child(2) { animation-delay: .04s; }
  .panel:nth-child(3) { animation-delay: .08s; }
  .panel h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mut);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel h2::before {
    content: "";
    width: 3px; height: 12px;
    border-radius: 2px;
    background: var(--accent);
    display: inline-block;
  }

  /* —— Status chips —— */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--bd);
    background: var(--bg2);
    font-size: 12px;
    color: var(--txt);
    max-width: 100%;
  }
  .chip .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--mut);
  }
  .chip.ok .dot { background: var(--down); box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.15); }
  .chip.bad .dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(224, 180, 78, 0.15); }
  .chip .label { color: var(--mut); }
  .chip .val { font-weight: 600; }
  .chip .hint { color: var(--mut); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

  .market {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.75;
    color: #d5dee8;
    padding: 4px 2px;
  }

  .sector-head {
    font-weight: 700;
    color: var(--gold);
    padding: 12px 0 6px;
    border-bottom: 1px solid var(--bd-soft);
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  /* —— Recommendation cards —— */
  .pick {
    padding: 12px 12px;
    margin: 8px 0 0;
    border-radius: 10px;
    border: 1px solid var(--bd-soft);
    background: linear-gradient(145deg, rgba(255,255,255,0.02), transparent 60%);
    transition: border-color .2s ease, background .2s ease;
  }
  .pick:hover { border-color: #3a4a5c; background: rgba(61, 184, 168, 0.04); }
  .pick .top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .pick .nm { font-weight: 600; font-size: 15px; }
  .tag {
    font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 6px;
    background: var(--accent-dim); color: var(--accent);
    letter-spacing: 0.02em;
  }
  .tag.buy { background: var(--danger-bg); color: var(--up); }
  .tag.sell { background: rgba(61, 214, 140, 0.12); color: var(--down); }
  .tag.must { background: var(--danger-bg); color: var(--up); border: 1px solid rgba(255,107,90,0.35); }
  .tag.gold { background: var(--gold-dim); color: var(--gold); }
  .pick .reason { color: var(--mut); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .metric { font-size: 12px; color: var(--mut); margin-top: 4px; }
  .conf { font-size: 12px; color: var(--mut); margin-left: 6px; }

  .up { color: var(--up); } .down { color: var(--down); }
  .warn { color: var(--up); font-weight: 700; }
  .take { color: var(--down); font-weight: 700; }
  .warn-row td { background: var(--danger-bg); }
  .trigger-banner {
    margin-top: 12px; padding: 11px 13px;
    border: 1px solid rgba(255,107,90,0.45); border-radius: 10px;
    color: var(--up); font-size: 13px; font-weight: 600;
    background: var(--danger-bg);
  }
  .data-warn {
    margin-bottom: 12px; padding: 11px 13px;
    border: 1px solid rgba(224,180,78,0.4); border-radius: 10px;
    color: var(--gold); font-size: 13px; line-height: 1.7;
    background: var(--warn-bg);
  }

  .progress-bar {
    width: 100%; height: 8px; background: #0d1218;
    border: 1px solid var(--bd); border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), #6fd9c8);
    transition: width .3s ease;
  }
  .progress-text { color: var(--mut); font-size: 12px; margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 9px 6px; border-bottom: 1px solid var(--bd-soft); }
  th { color: var(--mut); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  th:first-child, td:first-child { text-align: left; }
  @media (max-width: 640px) {
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  input {
    background: #0d1218; border: 1px solid var(--bd); color: var(--txt);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 120px;
    font-family: var(--font);
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  input.small { width: 96px; }
  .total { font-size: 14px; margin-top: 12px; }
  .loading { color: var(--mut); font-style: italic; padding: 16px 4px; }
  .watch-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 4px; border-bottom: 1px solid var(--bd-soft);
  }
  .watch-item .nm { font-weight: 600; }
  .watch-item .sec { color: var(--mut); font-size: 12px; }
  .hint { color: var(--mut); font-size: 12px; margin-bottom: 10px; }
  .foot-note {
    margin-top: 8px; color: var(--mut); font-size: 11px; text-align: center;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <div class="brand">trendingv2.1</div>
      <div class="tagline">A股本地辅助看板 · paper 模拟 + 持仓「必须卖出」建议 · 无券商下单</div>
      <div class="meta-line" id="gen-time">加载中…</div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="refreshPnl()">刷新持仓盈亏</button>
      <button id="btn-refresh" onclick="refreshReport()">刷新今日分析</button>
    </div>
  </header>

  <div id="progress-wrap" style="display:none;">
    <div class="panel">
      <h2>刷新进度</h2>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">准备中…</div>
    </div>
  </div>

  <div class="panel">
    <h2>数据状态</h2>
    <div id="status"><div class="loading">加载中…</div></div>
  </div>

  <div class="panel">
    <h2>市场情绪</h2>
    <div class="market" id="market">加载中…</div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>今日推荐 Top 10</h2>
      <div id="picks"><div class="loading">加载中…</div></div>
    </div>
    <div class="panel">
      <h2>自选股买卖信号</h2>
      <div id="recs"><div class="loading">加载中…</div></div>
    </div>
  </div>

  <div class="panel">
    <h2>自选股管理</h2>
    <div class="hint">输入代码后点「获取名称」，保存后「刷新今日分析」即可生效</div>
    <div class="row">
      <input id="w-symbol" class="small" placeholder="代码 600519" onblur="autoFillWatch()">
      <button class="ghost" onclick="autoFillWatch()">获取名称</button>
      <input id="w-name" placeholder="名称（自动填充）">
      <input id="w-sector" class="small" placeholder="板块">
      <button onclick="addWatch()">添加</button>
    </div>
    <div id="watch"><div class="loading">加载中…</div></div>
  </div>

  <div class="panel">
    <h2>我的持仓</h2>
    <div class="row">
      <input id="h-symbol" class="small" placeholder="代码 600519" onblur="autoFillHolding()">
      <button class="ghost" onclick="autoFillHolding()">获取名称</button>
      <input id="h-name" placeholder="名称（自动填充）">
      <input id="h-shares" class="small" placeholder="股数" type="number" step="100">
      <input id="h-cost" class="small" placeholder="成本价" type="number" step="0.01">
      <button onclick="addHolding()">添加持仓</button>
    </div>
    <div class="row">
      <input id="s-symbol" class="small" placeholder="代码 600519" onblur="autoFillSell()">
      <input id="s-shares" class="small" placeholder="卖出股数" type="number" step="100">
      <button class="ghost" onclick="sellHolding()">卖出/减持</button>
    </div>
    <div id="pnl"><div class="loading">尚未加载持仓…</div></div>
  </div>

  <p class="foot-note">仅供研究学习 · paper 结果 ≠ 未来表现 · 真实持仓仅 advisory</p>
</div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function getJSON(url, opts){ const r = await fetch(url, opts); return r.json(); }

async function autoFillWatch(){
  const sym = document.getElementById('w-symbol').value.trim();
  if(!sym) return;
  try {
    const d = await getJSON('/api/stock_info?symbol='+encodeURIComponent(sym));
    if(d.ok){ document.getElementById('w-name').value=d.name; document.getElementById('w-sector').value=d.sector||''; }
    else alert('未找到该代码：'+sym);
  } catch(e){ alert('获取名称失败：'+e); }
}
async function autoFillHolding(){
  const sym = document.getElementById('h-symbol').value.trim();
  if(!sym) return;
  try {
    const d = await getJSON('/api/stock_info?symbol='+encodeURIComponent(sym));
    if(d.ok){ document.getElementById('h-name').value=d.name; }
    else alert('未找到该代码：'+sym);
  } catch(e){ alert('获取名称失败：'+e); }
}

function renderPick(p, i){
  if(p.error) return '<div class="metric">'+esc(p.error)+'</div>';
  const sc = p.final_score!=null ? p.final_score : p.tech_score;
  const num = (i==null) ? '' : (i+1)+'. ';
  const tag = '<span class="tag gold">评分 '+esc(sc)+'</span>';
  return '<div class="pick"><div class="top"><span class="nm">'+esc(num)+esc(p.name)+' <span class="metric">('+esc(p.symbol)+')</span></span>'+tag+'</div>'
    + '<div class="metric">收盘 '+esc(p.close)+' · 5日 '+esc(p.ret5_pct)+'% · 20日 '+esc(p.ret20_pct)+'% · 成交 '+esc(p.amount_yi)+'亿</div>'
    + (p.reason ? '<div class="reason">'+esc(p.reason)+'</div>' : '')
    + '</div>';
}

function chip(label, ok, val, hint){
  const cls = ok ? 'chip ok' : 'chip bad';
  const hintHtml = hint ? ' <span class="hint">'+esc(hint)+'</span>' : '';
  return '<div class="'+cls+'"><span class="dot"></span><span class="label">'+esc(label)+'</span>'
    + '<span class="val">'+esc(val)+'</span>'+hintHtml+'</div>';
}

function renderStatus(r){
  const el = document.getElementById('status');
  const s = r.status;
  if(!s){ el.innerHTML='<div class="loading">（旧报告，点「刷新今日分析」后显示状态）</div>'; return; }
  const llmVal = s.llm_ok
    ? ('大模型 · ' + (s.model || s.llm_provider || 'openai'))
    : (s.llm_fallback === 'dictionary' || !s.llm_ok ? '词典法回退' : '失败');
  const llmHint = s.llm_detail || '';
  const newsVal = s.news_fetch_ok ? '成功' : '失败/空';
  const newsHint = s.news_detail || (s.news_provider ? '源: '+s.news_provider : '');
  const mktVal = s.data_ok ? ('OK' + (s.market_provider ? ' · '+s.market_provider : '')) : '部分失败';
  const mktHint = s.market_detail || '';
  const rows = [
    chip('大模型', !!s.llm_ok, llmVal, llmHint),
    chip('新闻', !!s.news_fetch_ok, newsVal, newsHint),
    chip('新闻打分', !!s.news_scoring_ok, s.news_scoring_ok ? 'OK' : '技术面降级', ''),
    chip('行情', !!s.data_ok, mktVal, mktHint),
    chip('交易日历', !!s.calendar_ok, s.calendar_ok ? 'OK' : '工作日估算', ''),
  ];
  if(s.screen_ok != null) rows.push(chip('全市场扫描', !!s.screen_ok, s.screen_ok ? 'OK' : '样本不足', ''));
  el.innerHTML = '<div class="chips">'+rows.join('')+'</div>';
}

function renderReport(r){
  renderStatus(r);
  const llmNote = r.llm_enabled
    ? (' · 大模型(' + esc(r.model) + ')')
    : ' · 词典法' + (r.llm_fallback ? '回退' : '');
  document.getElementById('gen-time').textContent = '生成于 ' + (r.generated_at||'')
    + ' · 数据日 ' + (r.market_data_date||'—')
    + ' · 下一交易日 ' + (r.target_trade_date||'—')
    + llmNote;
  document.getElementById('market').textContent = r.market_view || '（无）';

  const warns = [];
  if(r.data_quality && r.data_quality.screen_error)
    warns.push('全市场选股失败：' + esc(r.data_quality.screen_error) + '；未生成可执行推荐');
  if(r.news_scoring && r.news_scoring.ok === false)
    warns.push('候选股新闻打分失败，本榜已降级为技术面排序');
  const dq = r.data_quality || {};
  if(dq.calendar_ok === false) warns.push('交易日历获取失败，下一交易日按工作日估算');
  const screen = dq.screen || {};
  if(screen.scanned && screen.success_rate < 0.8){
    warns.push('全市场扫描仅成功 ' + screen.success + '/' + screen.scanned
      + '（' + Math.round(screen.success_rate*100) + '%），推荐样本不完整');
  }
  if(screen.market_regime === 'risk') warns.push('市场处于风险下降状态，推荐数量已限制，优先控制仓位');
  else if(screen.market_regime === 'neutral') warns.push('市场处于震荡状态，推荐数量和入选门槛已收紧');
  if(r.data_fresh === false) warns.push('数据已过期（' + (r.stale_stock_count||0) + ' 只自选股数据超过3天），请点「刷新今日分析」');
  const warnHtml = warns.length ? '<div class="data-warn">'+warns.join('<br>')+'</div>' : '';

  const picks = document.getElementById('picks');
  const plist = r.picks || [];
  const grouped = r.picks_by_sector || {};
  if(plist.length===0){ picks.innerHTML=warnHtml+'<div class="loading">暂无</div>'; }
  else {
    let html = '<div class="sector-head">总榜（Top '+plist.length+'，按综合评分）</div>';
    html += plist.map((p,i)=>renderPick(p,i)).join('');
    if(Object.keys(grouped).length>0){
      html += '<div class="sector-head" style="margin-top:12px;">按板块</div>';
      for(const [sec, arr] of Object.entries(grouped)){
        html += '<div class="sector-head">'+esc(sec)+' <span class="metric">('+arr.length+')</span></div>';
        html += arr.map((p)=>renderPick(p, null)).join('');
      }
    }
    picks.innerHTML = warnHtml + html;
  }
}

function renderRecs(rlist){
  const recs = document.getElementById('recs');
  if(!rlist || rlist.length===0){ recs.innerHTML='<div class="loading">暂无自选股信号</div>'; return; }
  recs.innerHTML = rlist.map(x=>{
    if(x.error) return '<div class="pick"><span class="metric">'+esc(x.name)+': '+esc(x.error)+'</span></div>';
    let cls = 'tag'; let act = x.action||'持有';
    if(act.includes('必须卖出')) cls='tag must';
    else if(act.includes('买入')) cls='tag buy';
    else if(act.includes('卖出')) cls='tag sell';
    const d = x.detail||{};
    return '<div class="pick"><div class="top"><span class="nm">'+esc(x.name)+' <span class="metric">('+esc(x.symbol)+')</span></span>'
      + '<span><span class="'+cls+'">'+esc(act)+'</span><span class="conf">置信 '+esc(x.confidence)+'%</span></span></div>'
      + '<div class="metric">收盘 '+esc(d.close)+' · MA5='+esc(d.ma_short)+' · MA20='+esc(d.ma_long)+'</div>'
      + (x.reasons||[]).map(r=>'<div class="metric">· '+esc(r)+'</div>').join('')
      + '</div>';
  }).join('');
}

async function loadRecs(){
  try {
    const d = await getJSON('/api/recs');
    renderRecs(d.recs);
    if(d.market_view) document.getElementById('market').textContent = d.market_view;
  } catch(e){ /* 静默 */ }
}

async function loadReport(refresh){
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true; btn.textContent = '分析中…';
  let pollTimer = null;
  if(refresh){
    showProgress();
    pollTimer = setInterval(pollProgress, 800);
  }
  try { renderReport(await getJSON('/api/report' + (refresh?'?refresh=1':''))); }
  catch(e){ alert('加载报告失败：'+e); }
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  hideProgress();
  btn.disabled = false; btn.textContent = '刷新今日分析';
}
function refreshReport(){ loadReport(true); }

function showProgress(){
  document.getElementById('progress-wrap').style.display = '';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-text').textContent = '准备中…';
}
function hideProgress(){
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').textContent = '完成';
  setTimeout(function(){ document.getElementById('progress-wrap').style.display = 'none'; }, 900);
}
async function pollProgress(){
  try {
    const p = await getJSON('/api/progress');
    document.getElementById('progress-fill').style.width = (p.percent||0) + '%';
    document.getElementById('progress-text').textContent = (p.stage||'') + (p.detail ? ' · '+p.detail : '');
  } catch(e){ /* 忽略 */ }
}

function renderWatch(items){
  const el = document.getElementById('watch');
  if(!items || items.length===0){ el.innerHTML='<div class="loading">暂无自选股</div>'; return; }
  el.innerHTML = items.map(it=>'<div class="watch-item"><span><span class="nm">'+esc(it.name)+'</span> <span class="metric">('+esc(it.symbol)+')</span> <span class="sec">'+esc(it.sector||'')+'</span></span><button class="mini" onclick="removeWatch(\''+esc(it.symbol)+'\')">删除</button></div>').join('');
}
async function loadWatch(){ renderWatch(await getJSON('/api/watchlist')); }
async function addWatch(){
  const symbol = document.getElementById('w-symbol').value.trim();
  const name = document.getElementById('w-name').value.trim();
  const sector = document.getElementById('w-sector').value.trim();
  if(!symbol || !name){ alert('请填写代码和名称（或点「获取名称」自动填充）'); return; }
  try {
    const r = await fetch('/api/watchlist/item', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol, name, sector})});
    const d = await r.json();
    if(!r.ok || !d.ok){ alert(d.error || '保存失败：HTTP '+r.status); return; }
    document.getElementById('w-symbol').value=''; document.getElementById('w-name').value=''; document.getElementById('w-sector').value='';
    renderWatch(d.items);
    alert('已添加 ' + name + '，正在更新信号…');
    loadRecs();
  } catch(e){ alert('添加失败：'+e); }
}
async function removeWatch(symbol){
  try {
    const r = await fetch('/api/watchlist/item', {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol})});
    const d = await r.json();
    if(!r.ok || !d.ok){ alert(d.error || '删除失败'); return; }
    renderWatch(d.items);
    loadRecs();
  } catch(e){ alert('删除失败：'+e); }
}

function renderPnl(d){
  const el = document.getElementById('pnl');
  if(!d.rows || d.rows.length===0){ el.innerHTML='<div class="loading">暂无持仓，请在上面添加。</div>'; return; }
  let html = '<table><tr><th>代码</th><th>名称</th><th>股数</th><th>成本</th><th>现价</th><th>盈亏%</th><th>止损价</th><th>止盈价</th><th>状态</th></tr>';
  let warnCount = 0;
  for(const r of d.rows){
    let pnlCls = r.pnl==null?'':(r.pnl>=0?'up':'down');
    let status = '持有';
    let statusCls = '';
    const trig = String(r.trigger||'');
    if(r.must_sell || trig.includes('必须卖出') || trig.includes('止损') || trig.includes('止盈')){
      warnCount++;
      statusCls = 'warn';
      if(trig.includes('止损')) status = '必须卖出 / 止损';
      else if(trig.includes('止盈')) status = '必须卖出 / 止盈';
      else status = trig || '必须卖出';
    }
    html += '<tr class="'+(statusCls?'warn-row':'')+'"><td>'+esc(r.symbol)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.shares)+'</td><td>'+esc(r.cost)+'</td>'
      + '<td>'+(r.price==null?'—':esc(r.price))+'</td>'
      + '<td class="'+pnlCls+'">'+(r.pnl_pct==null?'—':(r.pnl_pct>=0?'+':'')+r.pnl_pct+'%')+'</td>'
      + '<td>'+(r.stop_loss?esc(r.stop_loss):'—')+'</td><td>'+(r.take_profit?esc(r.take_profit):'—')+'</td>'
      + '<td class="'+statusCls+'">'+esc(status)+'</td></tr>';
  }
  html += '</table>';
  const t = d.total_pnl;
  const valueLabel = d.partial ? '已报价市值' : '总市值';
  const pnlLabel = d.partial ? '已报价持仓盈亏' : '总盈亏';
  const partialNote = d.partial ? ' <span class="warn">（' + d.missing_quotes + ' 只无报价，未报价成本 '+d.unpriced_cost.toLocaleString()+' 元）</span>' : '';
  html += '<div class="total">总成本 '+d.total_cost.toLocaleString()+' 元 · '+valueLabel+' '+d.total_value.toLocaleString()+' 元 · '
    + pnlLabel+' <span class="'+(t>=0?'up':'down')+'">'+(t>=0?'+':'')+t.toLocaleString()+' 元 ('+(t>=0?'+':'')+d.total_pnl_pct+'%)</span>'+partialNote+'</div>';
  if(warnCount>0){
    html += '<div class="trigger-banner">有 '+warnCount+' 只持仓触发必须卖出（advisory，不自动下单）。止损≈成本−8%，止盈≈成本+25%。</div>';
  }
  el.innerHTML = html;
}
async function loadPnl(){ renderPnl(await getJSON('/api/pnl')); }
async function refreshPnl(){ document.getElementById('pnl').innerHTML='<div class="loading">获取实时行情中…</div>'; await loadPnl(); }
async function addHolding(){
  const symbol = document.getElementById('h-symbol').value.trim();
  const name = document.getElementById('h-name').value.trim();
  const shares = parseInt(document.getElementById('h-shares').value,10);
  const cost = parseFloat(document.getElementById('h-cost').value);
  if(!symbol || !name || !shares || !cost){ alert('请填写代码、名称、股数、成本价'); return; }
  try {
    const r = await fetch('/api/holdings/item', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol, name, shares, cost_price:cost})});
    const d = await r.json();
    if(!r.ok || !d.ok){ alert(d.error || '保存失败：HTTP '+r.status); return; }
    document.getElementById('h-symbol').value=''; document.getElementById('h-name').value='';
    document.getElementById('h-shares').value=''; document.getElementById('h-cost').value='';
    alert('已添加持仓 ' + name);
    await loadPnl();
  } catch(e){ alert('添加失败：'+e); }
}

async function autoFillSell(){
  const sym = document.getElementById('s-symbol').value.trim();
  if(!sym) return;
  await getJSON('/api/stock_info?symbol='+encodeURIComponent(sym));
  const items = await getJSON('/api/holdings');
  const h = items.find(x=>x.symbol===sym);
  if(h){ document.getElementById('s-shares').value = h.shares; }
}
async function sellHolding(){
  const symbol = document.getElementById('s-symbol').value.trim();
  const shares = parseInt(document.getElementById('s-shares').value,10);
  if(!symbol || !shares){ alert('请填写代码和卖出股数'); return; }
  try {
    const r = await fetch('/api/holdings/sell', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({symbol, shares})});
    const d = await r.json();
    if(!d.ok){ alert(d.error || '卖出失败'); return; }
    alert('已卖出 ' + shares + ' 股' + (d.remain>0 ? '，剩余 '+d.remain+' 股' : '（已清仓）'));
    document.getElementById('s-symbol').value=''; document.getElementById('s-shares').value='';
    await loadPnl();
  } catch(e){ alert('卖出失败：'+e); }
}

loadReport(false);
loadRecs();
loadWatch();
loadPnl();
